<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Site oficial do jogo HospitalRush, desenvolvido com Pygame. Jogue agora e divirta-se montando kits e estratégias!">
  <title>HospitalRush</title>
  <link rel="stylesheet" href="reset.css"/>
  <link rel="stylesheet" href="style.css" />

</head>
<body>

  <header>
    <nav>
      <a href="#hero">Início</a>
      <a href="#galeria">Galeria</a>
      <a href="#sobre">Sobre</a>
    </nav>
  </header>

  <main>
    <section id="hero">
      <img class = "imagem_central" src="img/capanova.png" alt="Capa do jogo HospitalRush" />
      <a href="#" class="chatgpt-icon"><img src="img/ChatGPT Image 26 de abr. de 2026, 19_25_00.png" alt="Ícone ChatGPT" /></a>
      <button>Jogar Agora</button>
    </section>

    <section id="galeria">
      <h2>MEDIA GALERY</h2>
      <div class="galeria">
        <img src="img/rascunho_site.jpeg" alt="Screenshot 1 do jogo HospitalRush" />
        <img src="img/rascunho_site.jpeg" alt="Screenshot 2 do jogo HospitalRush" />
        <img src="img/rascunho_site.jpeg" alt="Screenshot 3 do jogo HospitalRush" />
      </div>
    </section>

    <section id="sobre">
      <h2>Sobre o Jogo</h2>
      <p>Monte os kits ideais de acordo com a demanda!</p>
      <p>Monte sua estratégia com sua dupla para obter a melhor pontuação!</p>
      <p>Fique atento ao tempo de entrega para não perder pontos.</p>
    </section>
  </main>

  <footer>
    2026 - HospitalRush - Desenvolvido com Pygame - Mateus gama & Ryan
  </footer>

</html>
